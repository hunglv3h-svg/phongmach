# Backend Medplum cho PHONGMACH — chỉ dành cho dev / thử nghiệm.
# Không dùng nguyên trạng cho production (xem README.md, mục "Trước khi đưa lên production").
#
#   node infra/medplum/setup.mjs
#   docker compose -f infra/medplum/docker-compose.yml up -d
#
# Phiên bản được ghim cố ý: không dùng "latest" để việc nâng cấp là quyết định có kiểm soát.
name: phongmach-medplum

services:
  # Container Medplum chạy bằng uid 1000 và không có shell; volume mới tạo thuộc root
  # nên cần chown một lần để server ghi được vào /data.
  init-data:
    image: busybox:1.37
    command: ['chown', '-R', '1000:1000', '/data']
    user: '0:0'
    volumes:
      - medplum-data:/data
    restart: 'no'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chạy node infra/medplum/setup.mjs trước}
      POSTGRES_DB: medplum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum -d medplum']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?chạy node infra/medplum/setup.mjs trước}']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  medplum-server:
    image: medplum/medplum-server:5.2.0
    command: ['file:/usr/src/medplum/medplum.config.json']
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${MEDPLUM_PORT:-8103}:8103'
    volumes:
      - ./config/medplum.config.json:/usr/src/medplum/medplum.config.json:ro
      - medplum-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  medplum-data:
