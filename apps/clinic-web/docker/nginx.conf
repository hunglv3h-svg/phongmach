user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # manifest.webmanifest cần đúng content-type (một số bản nginx không có sẵn trong mime.types).
  types {
    application/manifest+json  webmanifest;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api -> BFF cùng network namespace (nghe 127.0.0.1:8110). GIỮ NGUYÊN path /api.
    # TUYỆT ĐỐI KHÔNG proxy_cache cho /api (có dữ liệu bệnh nhân).
    location /api/ {
      proxy_pass http://127.0.0.1:8110;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vỏ app KHÔNG cache: index.html, service worker, manifest.
    # Tên service worker thực do vite-plugin-pwa (registerType autoUpdate) sinh: sw.js + workbox-*.js.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
    location = /sw.js {
      add_header Cache-Control "no-cache";
    }
    location ~ ^/workbox-.*\.js$ {
      add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
      add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
      add_header Cache-Control "no-cache";
    }

    # Asset có hash (assets/*): cache dài, immutable.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA fallback.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
